name: CI Quality Gate

# 触发分流:
#   push / pull_request → 代码质量门禁 (后端编译 + 前端构建)
#   schedule (每日北京时间 11:00) / workflow_dispatch → 上游仓库同步合并
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------- 代码质量门禁 (push / PR) ----------------
  backend-quality:
    name: Backend Syntax & Compile Check
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile Backend App
        run: |
          python -m compileall backend/app

  frontend-quality:
    name: Frontend Lint & Build Check
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Lint Gate
        working-directory: frontend
        run: npm run lint

      - name: Run Production Build
        working-directory: frontend
        run: npm run build

  # ---------------- 上游仓库同步合并 (每日定时 / 手动) ----------------
  sync-upstream:
    name: Sync Other Repositories (检测其他仓库更新并合并)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/AkiSeele/xiaocan-assistant.git || true
          git fetch upstream --tags || echo "::warning::上游仓库拉取失败"

      - name: Check upstream updates
        id: check
        run: |
          # 已同步清单 (每行一个上游提交SHA, 随仓库存储; 内容已在本地或已甄别处理的记录于此)
          touch .github/workflows/.upstream-synced-sha
          sort -u .github/workflows/.upstream-synced-sha -o .github/workflows/.upstream-synced-sha
          git rev-list --reverse --no-merges upstream/main > /tmp/all_shas.txt
          grep -vxFf .github/workflows/.upstream-synced-sha /tmp/all_shas.txt > /tmp/pending_shas.txt || true
          COUNT=$(wc -l < /tmp/pending_shas.txt | tr -d ' ')
          echo "待甄别同步提交数: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            while read s; do git log -1 --format='- %h %s' "$s"; done < /tmp/pending_shas.txt
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "上游无新提交"
          fi

      - name: Cherry-pick upstream commits (行级甄别: 保本地功能+吸收修复, 冲突隔离待人工)
        id: merge
        if: steps.check.outputs.has_updates == 'true'
        run: |
          echo "before_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          applied=0; skipped=0; conflicted=0
          : > /tmp/applied_list.txt
          : > /tmp/pending_list.txt
          while read sha; do
            [ -z "$sha" ] && continue
            subj=$(git log -1 --format='%s' "$sha")
            if git cherry-pick -n "$sha" >/dev/null 2>&1; then
              if git diff --cached --quiet; then
                # 本地已有等价实现 (应用后无实质变化)
                skipped=$((skipped+1))
                echo "$sha" >> .github/workflows/.upstream-synced-sha
              else
                git log -1 --format='%s' "$sha" > /tmp/cmsg.txt
                git commit -q -F /tmp/cmsg.txt
                applied=$((applied+1))
                echo "- $sha $subj" >> /tmp/applied_list.txt
                echo "$sha" >> .github/workflows/.upstream-synced-sha
              fi
            else
              # 真冲突: 隔离待人工甄别 (不写入清单, 下次运行自动重试, 永不静默丢弃)
              git cherry-pick --abort >/dev/null 2>&1 || true
              git checkout -- . || true
              conflicted=$((conflicted+1))
              echo "- $sha $subj" >> /tmp/pending_list.txt
            fi
          done < /tmp/pending_shas.txt
          echo "applied=$applied" >> "$GITHUB_OUTPUT"
          echo "conflicted=$conflicted" >> "$GITHUB_OUTPUT"
          echo "甄别结果: 自动应用 $applied | 等价跳过 $skipped | 冲突隔离 $conflicted"
          changed=false
          if [ "$applied" -gt 0 ]; then
            changed=true
          fi
          sort -u .github/workflows/.upstream-synced-sha -o .github/workflows/.upstream-synced-sha
          git add .github/workflows/.upstream-synced-sha
          if ! git diff --cached --quiet -- .github/workflows/.upstream-synced-sha; then
            git commit -q -m "chore: 更新上游已同步提交清单"
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$conflicted" -gt 0 ]; then
            echo "::warning::有 $conflicted 个上游提交存在冲突已隔离待人工甄别 (未丢弃, 下次运行自动重试)"
          fi

      - name: Verify sync result (后端编译 + 前端构建)
        id: verify
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -e
          echo "== 后端编译检查 =="
          python3 -m compileall -q backend/app
          echo "== 前端构建 =="
          cd frontend
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      - name: Rollback on verify failure (验证失败自动回退本次同步)
        if: failure() && steps.merge.outputs.changed == 'true'
        run: |
          git reset --hard "${ steps.merge.outputs.before_sha }"
          echo "::error::Sync Other Repositories 同步后验证失败 (后端编译或前端构建)，已自动回退本次合并、未推送远程，请手动检查上游改动"
          {
            echo "### Sync Other Repositories 同步已自动回退"
            echo ""
            echo "合并后自动验证失败（py_compile / 前端构建），本次同步未推送，仓库保持原状。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync report (甄别式同步报告)
        if: always() && steps.check.outputs.has_updates == 'true'
        run: |
          {
            echo "### Sync Other Repositories 甄别式同步报告"
            echo ""
            echo "- 自动应用: ${{ steps.merge.outputs.applied || 0 }} 条"
            echo "- 冲突隔离(待人工): ${{ steps.merge.outputs.conflicted || 0 }} 条"
            if [ -s /tmp/applied_list.txt ]; then
              echo ""
              echo "<details><summary>本次自动应用的提交</summary>"
              echo ""
              echo '```'
              cat /tmp/applied_list.txt
              echo '```'
              echo "</details>"
            fi
            if [ -s /tmp/pending_list.txt ]; then
              echo ""
              echo "⚠️ **以下上游提交存在冲突, 已隔离待人工甄别 (未丢弃, 下次运行自动重试):**"
              echo ""
              echo '```'
              cat /tmp/pending_list.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push
        if: steps.merge.outputs.changed == 'true' && success()
        run: git push origin main
