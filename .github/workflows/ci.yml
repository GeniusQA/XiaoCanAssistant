name: CI Quality Gate

# 触发分流:
#   push / pull_request → 代码质量门禁 (后端编译 + 前端构建)
#   schedule (每日北京时间 11:00) / workflow_dispatch → 上游仓库同步合并
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------- 代码质量门禁 (push / PR) ----------------
  backend-quality:
    name: Backend Syntax & Compile Check
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile Backend App
        run: |
          python -m compileall backend/app

  frontend-quality:
    name: Frontend Lint & Build Check
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Lint Gate
        working-directory: frontend
        run: npm run lint

      - name: Run Production Build
        working-directory: frontend
        run: npm run build

  # ---------------- 上游仓库同步合并 (每日定时 / 手动) ----------------
  sync-upstream:
    name: Sync Other Repositories (检测其他仓库更新并合并)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/AkiSeele/xiaocan-assistant.git || true
          git fetch upstream --tags || echo "::warning::上游仓库拉取失败"

      - name: Check upstream updates
        id: check
        run: |
          COUNT=$(git rev-list --count HEAD..upstream/main 2>/dev/null || echo 0)
          echo "上游领先提交数: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            git log HEAD..upstream/main --oneline | head -20
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "上游无新提交"
          fi

      - name: Merge upstream (squash 压缩, 不保留上游作者; 冲突保留本仓库代码)
        id: merge
        if: steps.check.outputs.has_updates == 'true'
        run: |
          # 记录合并前 SHA, 供验证失败时自动回退
          echo "before_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          before_tree=$(git rev-parse 'HEAD^{tree}')
          # 上游若带回独立同步工作流文件, 统一清理 (避免与本工作流重复)
          git rm -f --ignore-unmatch .github/workflows/sync-upstream.yml || true
          # --squash: 上游变更压缩为单个提交 (作者=github-actions[bot]), 不引入上游提交历史与作者信息
          # -X ours: 内容冲突时保留本仓库版本
          if git merge -X ours --squash --allow-unrelated-histories upstream/main; then
            # 合并说明统一为 Sync Other Repositories, 不出现任何上游仓库/作者信息
            git commit -m "chore: Sync Other Repositories"
            after_tree=$(git rev-parse 'HEAD^{tree}')
            if [ "$before_tree" = "$after_tree" ]; then
              # 合并后文件树无实质变化 (上游改动已被本仓库包含), 回退避免空提交噪音
              echo "changed=false" >> "$GITHUB_OUTPUT"
              git reset --hard 'HEAD~1'
              echo "上游无实质内容变化，跳过推送"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              git --no-pager diff --stat 'HEAD~1' HEAD | tail -5
            fi
          else
            git merge --abort || true
            git reset --hard HEAD || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::上游合并存在无法自动解决的冲突，已中止，请手动处理"
          fi

      - name: Verify sync result (后端编译 + 前端构建)
        id: verify
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -e
          echo "== 后端编译检查 =="
          python3 -m compileall -q backend/app
          echo "== 前端构建 =="
          cd frontend
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      - name: Rollback on verify failure (验证失败自动回退本次同步)
        if: failure() && steps.merge.outputs.changed == 'true'
        run: |
          git reset --hard "${{ steps.merge.outputs.before_sha }}"
          echo "::error::Sync Other Repositories 同步后验证失败 (后端编译或前端构建)，已自动回退本次合并、未推送远程，请手动检查上游改动"
          {
            echo "### Sync Other Repositories 同步已自动回退"
            echo ""
            echo "合并后自动验证失败（py_compile / 前端构建），本次同步未推送，仓库保持原状。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push
        if: steps.merge.outputs.changed == 'true' && success()
        run: git push origin main
